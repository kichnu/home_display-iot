; Waveshare ESP32-S3-Touch-LCD-4.3B — aquarium touch panel
; Module: ESP32-S3-WROOM-1-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
; Arduino core 3.x (ESP-IDF 5.x) is required for the RGB panel bounce-buffer API.

[platformio]
; plain `pio run` must not build/upload the OTA env too
default_envs = esp32s3-lcd43b

[env:esp32s3-lcd43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; copy of the core default_16MB.csv (two OTA slots); hybrid compile needs it in the project
board_build.partitions = partitions.csv

; Code and rodata executed from PSRAM: flash writes (NVS on Wi-Fi init, OTA, LittleFS) then do not
; disable the cache. The prebuilt libs have LCD_RGB_ISR_IRAM_SAFE, so the RGB bounce-buffer ISR keeps
; running during flash ops and reads the PSRAM framebuffer — without XIP that panics with "Cache
; disabled but cached memory region accessed". Triggers pioarduino hybrid compile of the framework libs.
; The hybrid compile starts from the generic esp32s3 sdkconfig, not from the qio_opi variant picked
; by memory_type, so the octal PSRAM of the N16R8 module must be set here too.
custom_sdkconfig =
    CONFIG_SPIRAM_MODE_OCT=y
    # CONFIG_SPIRAM_MODE_QUAD is not set
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
; Unused cloud components; esp_insights also breaks the hybrid build (embedded https_server.crt
; "not found" in pioarduino 54.03.20).
custom_component_remove =
    espressif/esp_insights
    espressif/esp_rainmaker
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/rmaker_common
    espressif/esp_schedule

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; Secrets from ~/.secrets/iot.env via pre-scripts -> generated headers in $BUILD_DIR/generated
; (not ${sysenv...}: it would enter project.checksum and force full rebuilds).
; OTA password variable named after the panel IP (DHCP reservation on the router).
custom_ota_password_var = OTA_PASSWORD_192_168_10_50
extra_scripts =
    pre:scripts/ota_secret.py
    pre:scripts/wifi_secret.py

lib_deps =
    lvgl/lvgl@9.2.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload over Wi-Fi (ArduinoOTA), same firmware. First upload with OTA code goes over USB.
[env:esp32s3-lcd43b_ota]
extends = env:esp32s3-lcd43b
upload_protocol = espota
upload_port = 192.168.10.50
; fixed return port — the PC and the panel are in different subnets (IoT VLAN), the espota
; connection back to the PC needs a firewall rule limited to this port
upload_flags =
    --host_port=8266
